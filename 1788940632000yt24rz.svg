<text x="130" y="190" text-anchor="end" font-size="14" font-weight="600" fill="#222222">row 3</text>
<text x="130" y="240" text-anchor="end" font-size="14" font-weight="600" fill="#222222">row 4</text>

<rect x="190" y="70" width="100" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="0.5"/>
<rect x="290" y="70" width="100" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="0.5"/>
<rect x="390" y="70" width="100" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="0.5"/>

<rect x="190" y="110" width="100" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="0.5"/>
<rect x="290" y="110" width="100" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="0.5"/>
<rect x="390" y="110" width="100" height="40" fill="#378ADD" stroke="#0C447C" stroke-width="0.5"/>

<rect x="190" y="150" width="100" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="0.5"/>
<rect x="290" y="150" width="100" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="0.5"/>
<rect x="390" y="150" width="100" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="0.5"/>

<rect x="190" y="190" width="100" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="0.5"/>
<rect x="290" y="190" width="100" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="0.5"/>
<rect x="390" y="190" width="100" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="0.5"/>

<text x="440" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">C[2][3]</text>

<line x1="132" y1="130" x2="185" y2="130" stroke="#333333" stroke-width="1.2"/>
<polygon points="185,130 178,126 178,134" fill="#333333"/>
<line x1="440" y1="60" x2="440" y2="105" stroke="#333333" stroke-width="1.2"/>
<polygon points="440,105 436,98 444,98" fill="#333333"/>

<text x="340" y="270" text-anchor="middle" font-size="12" fill="#666666">row index of C matches row index of A</text>
<text x="340" y="288" text-anchor="middle" font-size="12" fill="#666666">column index of C matches column index of B</text>
